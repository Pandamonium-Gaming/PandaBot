name: Build and Deploy

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'tools/**'
      - '.github/workflows/dotnet.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'tools/**'
      - '.github/workflows/dotnet.yml'

env:
  DOTNET_VERSION: '10.0.x'
  PROJECT_PATH: 'src/PandaBot/PandaBot.csproj'
  DEPLOY_USER: 'deployer'
  DEPLOY_PATH: '/opt/pandabot'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build VersionManager
        run: dotnet build tools/VersionManager/VersionManager.csproj --configuration Release

      - name: Check commits since last version
        run: dotnet artifacts/bin/VersionManager/release/VersionManager.dll check-commits || true

      - name: Clear NuGet cache
        run: dotnet nuget locals all --clear

      - name: Restore dependencies
        run: dotnet restore ${{ env.PROJECT_PATH }} --verbosity diagnostic

      - name: Build
        env:
          UEX__BearerToken: ${{ secrets.UEX_BEARER_TOKEN }}
        run: dotnet build ${{ env.PROJECT_PATH }} --configuration Release --no-restore

      - name: Publish
        run: dotnet publish ${{ env.PROJECT_PATH }} --configuration Release --no-build --output ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: PandaBot-publish
          path: publish/

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Download artifact
      uses: actions/download-artifact@v8
      with:
        name: PandaBot-publish
        path: ./publish

    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

    - name: Stop bot service
      run: |
        ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ env.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
          "sudo systemctl stop pandabot.service || true"

    - name: Deploy files
      run: |
        rsync -avz --delete -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
          ./publish/ ${{ env.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/pandabot_publish/

    - name: Move files to deployment directory
      run: |
        ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ env.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
          "sudo rsync -avz /tmp/pandabot_publish/ ${{ env.DEPLOY_PATH }}/ && sudo rm -rf /tmp/pandabot_publish/"

    - name: Deploy systemd service file
      run: |
        scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no .github/deployment/pandabot.service ${{ env.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/pandabot.service
        ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ env.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
          "sudo mv /tmp/pandabot.service /etc/systemd/system/pandabot.service && sudo systemctl daemon-reload"

    - name: Set permissions
      run: |
        ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ env.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
          "sudo chown -R pandabot:pandabot ${{ env.DEPLOY_PATH }} && \
           sudo chmod +x ${{ env.DEPLOY_PATH }}/PandaBot"

    - name: Create/Update .env file
      env:
        DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        UEX_BEARER_TOKEN: ${{ secrets.UEX_BEARER_TOKEN }}
        HEARTBEAT_ENABLED: ${{ secrets.HEARTBEAT_ENABLED }}
        HEARTBEAT_PUSH_URL: ${{ secrets.HEARTBEAT_PUSH_URL }}
        HEARTBEAT_INTERVAL_SECONDS: ${{ secrets.HEARTBEAT_INTERVAL_SECONDS }}
        HEARTBEAT_STARTUP_DELAY_SECONDS: ${{ secrets.HEARTBEAT_STARTUP_DELAY_SECONDS }}
        HEARTBEAT_TIMEOUT_SECONDS: ${{ secrets.HEARTBEAT_TIMEOUT_SECONDS }}
      run: |
        printf '%s\n' \
          "PANDABOT_Discord__Token=$DISCORD_TOKEN" \
          "PANDABOT_Discord__Prefix=!" \
          "PANDABOT_ConnectionStrings__DefaultConnection=Data Source=${{ env.DEPLOY_PATH }}/pandabot.db" \
          "PANDABOT_AshesForge__CacheExpirationHours=24" \
          "PANDABOT_AshesForge__EnableImageCaching=true" \
          "PANDABOT_UEX__BearerToken=$UEX_BEARER_TOKEN" \
          "PANDABOT_UEX__ApiBaseUrl=https://api.uexcorp.uk" \
          "PANDABOT_UEX__TimeoutSeconds=30" \
          "PANDABOT_Discord__Heartbeat__Enabled=${HEARTBEAT_ENABLED:-false}" \
          "PANDABOT_Discord__Heartbeat__PushUrl=$HEARTBEAT_PUSH_URL" \
          "PANDABOT_Discord__Heartbeat__IntervalSeconds=${HEARTBEAT_INTERVAL_SECONDS:-60}" \
          "PANDABOT_Discord__Heartbeat__StartupDelaySeconds=${HEARTBEAT_STARTUP_DELAY_SECONDS:-15}" \
          "PANDABOT_Discord__Heartbeat__TimeoutSeconds=${HEARTBEAT_TIMEOUT_SECONDS:-10}" > /tmp/pandabot.env
        scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no /tmp/pandabot.env ${{ env.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/pandabot.env
        ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ env.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
          "sudo mv /tmp/pandabot.env ${{ env.DEPLOY_PATH }}/.env && sudo chmod 600 ${{ env.DEPLOY_PATH }}/.env"
        rm /tmp/pandabot.env

    - name: Start bot service
      run: |
        ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ env.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
          "sudo systemctl start pandabot.service"

    - name: Check service status
      run: |
        ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ env.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
          "ok=0; \
           for i in \$(seq 1 20); do \
             ACTIVE=\$(sudo systemctl is-active pandabot.service || true); \
             SUB=\$(sudo systemctl show -p SubState --value pandabot.service || true); \
             echo \"Attempt \$i: active=\$ACTIVE substate=\$SUB\"; \
             if [ \"\$ACTIVE\" = \"active\" ] && [ \"\$SUB\" = \"running\" ]; then \
               ok=1; \
               break; \
             fi; \
             sleep 3; \
           done; \
           sudo systemctl status pandabot.service --no-pager || true; \
           sudo journalctl -u pandabot.service -n 80 --no-pager || true; \
           [ \"\$ok\" -eq 1 ]"

    - name: Cleanup SSH key
      if: always()
      run: rm -f ~/.ssh/deploy_key
