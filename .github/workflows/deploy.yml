name: Deploy to Digital Ocean

on:
  workflow_run:
    workflows: [".NET CI"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.203'
  PROJECT_PATH: 'src/PandaBot/PandaBot.csproj'
  DEPLOY_USER: 'deployer'
  RUNTIME_USER: 'pandabot'
  DEPLOY_PATH: '/opt/pandabot'

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore ${{ env.PROJECT_PATH }}

    - name: Build VersionManager (Release)
      run: dotnet build "$GITHUB_WORKSPACE/tools/VersionManager/VersionManager.csproj" --configuration Release

    - name: Build
      env:
        UEX__BearerToken: ${{ secrets.UEX_BEARER_TOKEN }}
      run: dotnet build ${{ env.PROJECT_PATH }} --configuration Release --no-restore

    - name: Publish
      run: dotnet publish ${{ env.PROJECT_PATH }} --configuration Release --no-build --output ./publish

    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        KEY_SECRET_RAW="${{ secrets.DEPLOY_SSH_KEY }}"
        KEY_SECRET_TRIMMED=$(printf '%s' "$KEY_SECRET_RAW" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
        case "$KEY_SECRET_TRIMMED" in
          \"*\") KEY_SECRET_TRIMMED=${KEY_SECRET_TRIMMED#\"}; KEY_SECRET_TRIMMED=${KEY_SECRET_TRIMMED%\"} ;;
          \'*\') KEY_SECRET_TRIMMED=${KEY_SECRET_TRIMMED#\'}; KEY_SECRET_TRIMMED=${KEY_SECRET_TRIMMED%\'} ;;
        esac

        if printf '%s' "$KEY_SECRET_TRIMMED" | grep -q '\\n'; then
          printf '%b' "$KEY_SECRET_TRIMMED" > ~/.ssh/deploy_key
        elif printf '%s' "$KEY_SECRET_TRIMMED" | grep -q "BEGIN .* PRIVATE KEY" && printf '%s' "$KEY_SECRET_TRIMMED" | grep -q $'\n'; then
          printf '%s' "$KEY_SECRET_TRIMMED" > ~/.ssh/deploy_key
        elif printf '%s' "$KEY_SECRET_TRIMMED" | tr -d '\r\n\t ' | base64 -d > ~/.ssh/deploy_key 2>/dev/null; then
          :
        elif printf '%s' "$KEY_SECRET_TRIMMED" | tr -d '\r\n\t ' | tr '_-' '/+' | base64 -d > ~/.ssh/deploy_key 2>/dev/null; then
          :
        else
          echo "Invalid DEPLOY_SSH_KEY format. Provide raw key, escaped \\n key, or base64 key."
          exit 1
        fi

        # Normalize potential CRLF and verify we decoded an actual private key (not .pub or wrong file).
        sed -i 's/\r$//' ~/.ssh/deploy_key
        if ! grep -q "BEGIN .* PRIVATE KEY" ~/.ssh/deploy_key; then
          echo "DEPLOY_SSH_KEY decoded, but does not look like a private key. Ensure secret is base64 of the PRIVATE key file, not .pub."
          exit 1
        fi

        chmod 600 ~/.ssh/deploy_key
        ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null
        ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

    - name: Preflight host permissions
      run: |
        ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ env.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
          "sudo -n mkdir -p ${{ env.DEPLOY_PATH }} && sudo -n chown -R ${{ env.DEPLOY_USER }}:${{ env.DEPLOY_USER }} ${{ env.DEPLOY_PATH }} && test -w ${{ env.DEPLOY_PATH }}"

    - name: Stop bot service
      run: |
        ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ env.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
          "sudo -n systemctl stop pandabot.service || true"

    - name: Deploy files
      run: |
        # Preserve runtime SQLite/log files and avoid timestamp writes on runtime-owned files.
        rsync -avz --no-times --no-group --delete --exclude='*.db' --exclude='*.db-shm' --exclude='*.db-wal' --exclude='logs/' -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
          ./publish/ ${{ env.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ env.DEPLOY_PATH }}/

    - name: Deploy systemd service file
      run: |
        REMOTE_STAGE="/home/${{ env.DEPLOY_USER }}/pandabot-deploy-staging"
        ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ env.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "mkdir -p ${REMOTE_STAGE}"
        scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no .github/deployment/pandabot.service ${{ env.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${REMOTE_STAGE}/pandabot.service
        ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ env.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
          "test -s ${REMOTE_STAGE}/pandabot.service && \
           sudo -n tee /etc/systemd/system/pandabot.service < ${REMOTE_STAGE}/pandabot.service > /dev/null && \
           sudo -n chown root:root /etc/systemd/system/pandabot.service && \
           sudo -n chmod 644 /etc/systemd/system/pandabot.service && \
           rm -f ${REMOTE_STAGE}/pandabot.service && \
           sudo -n systemctl daemon-reload"

    - name: Deploy journald retention policy
      run: |
        REMOTE_STAGE="/home/${{ env.DEPLOY_USER }}/pandabot-deploy-staging"
        ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ env.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "mkdir -p ${REMOTE_STAGE}"
        scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no .github/deployment/journald-bot-limits.conf ${{ env.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${REMOTE_STAGE}/journald-bot-limits.conf
        ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ env.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
          "sudo -n mkdir -p /etc/systemd/journald.conf.d && \
           test -s ${REMOTE_STAGE}/journald-bot-limits.conf && \
           sudo -n tee /etc/systemd/journald.conf.d/60-bot-limits.conf < ${REMOTE_STAGE}/journald-bot-limits.conf > /dev/null && \
           sudo -n chown root:root /etc/systemd/journald.conf.d/60-bot-limits.conf && \
           sudo -n chmod 644 /etc/systemd/journald.conf.d/60-bot-limits.conf && \
           rm -f ${REMOTE_STAGE}/journald-bot-limits.conf && \
           sudo -n systemctl restart systemd-journald && \
           sudo -n journalctl --rotate && \
           sudo -n journalctl --vacuum-time=14d --vacuum-size=500M"

    - name: Write .env file from secrets
      run: |
        ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ env.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
          "sudo -n tee ${{ env.DEPLOY_PATH }}/.env > /dev/null << 'ENVEOF'
        PANDABOT_Discord__Token=${{ secrets.DISCORD_TOKEN }}
        PANDABOT_Discord__GuildId=${{ secrets.GUILD_ID || '449201329798119474' }}
        PANDABOT_Discord__Prefix=!
        PANDABOT_ConnectionStrings__DefaultConnection=Data Source=${{ env.DEPLOY_PATH }}/pandabot.db
        PANDABOT_AshesForge__CacheExpirationHours=24
        PANDABOT_AshesForge__EnableImageCaching=true
        PANDABOT_UEX__BearerToken=${{ secrets.UEX_BEARER_TOKEN }}
        PANDABOT_UEX__ApiBaseUrl=https://api.uexcorp.uk
        PANDABOT_UEX__TimeoutSeconds=30
        PANDABOT_Discord__Heartbeat__Enabled=${{ secrets.HEARTBEAT_ENABLED || 'false' }}
        PANDABOT_Discord__Heartbeat__PushUrl=${{ secrets.HEARTBEAT_PUSH_URL }}
        PANDABOT_Discord__Heartbeat__IntervalSeconds=${{ secrets.HEARTBEAT_INTERVAL_SECONDS || '60' }}
        PANDABOT_Discord__Heartbeat__StartupDelaySeconds=${{ secrets.HEARTBEAT_STARTUP_DELAY_SECONDS || '15' }}
        PANDABOT_Discord__Heartbeat__TimeoutSeconds=${{ secrets.HEARTBEAT_TIMEOUT_SECONDS || '10' }}
        PANDABOT_ModerationLog__ForumChannelId=${{ secrets.MODERATION_LOG_FORUM_CHANNEL_ID || '0' }}
        PANDABOT_ModerationLog__ModeratorRoleId=${{ secrets.MODERATION_LOG_MODERATOR_ROLE_ID || '0' }}
        PANDABOT_CrossChannelSpam__Enabled=${{ secrets.CROSS_CHANNEL_SPAM_ENABLED || 'false' }}
        PANDABOT_CrossChannelSpam__TimeWindowSeconds=${{ secrets.CROSS_CHANNEL_SPAM_TIME_WINDOW_SECONDS || '30' }}
        PANDABOT_CrossChannelSpam__MinimumChannelCount=${{ secrets.CROSS_CHANNEL_SPAM_MINIMUM_CHANNEL_COUNT || '3' }}
        PANDABOT_ModerationExemptions__ExemptUserIds__0=${{ secrets.MODERATION_EXEMPT_USER_ID_0 || '' }}
        PANDABOT_ModerationExemptions__ExemptRoleIds__0=${{ secrets.MODERATION_EXEMPT_ROLE_ID_0 || '' }}
        PANDABOT_CommandAccess__DisableAllFunCommands=${{ secrets.COMMAND_ACCESS_DISABLE_ALL_FUN_COMMANDS || 'false' }}
        PANDABOT_CommandAccess__DisabledCommands__0=${{ secrets.COMMAND_ACCESS_DISABLED_COMMAND_0 || '' }}
        PANDABOT_CommandAccess__DisabledCommands__1=${{ secrets.COMMAND_ACCESS_DISABLED_COMMAND_1 || '' }}
        PANDABOT_CommandAccess__DisabledCommands__2=${{ secrets.COMMAND_ACCESS_DISABLED_COMMAND_2 || '' }}
        PANDABOT_CommandAccess__DisabledCommands__3=${{ secrets.COMMAND_ACCESS_DISABLED_COMMAND_3 || '' }}
        PANDABOT_CommandAccess__DisabledCommands__4=${{ secrets.COMMAND_ACCESS_DISABLED_COMMAND_4 || '' }}
        PANDABOT_CommandAccess__DisabledCommands__5=${{ secrets.COMMAND_ACCESS_DISABLED_COMMAND_5 || '' }}
        PANDABOT_CommandAccess__DisabledCommands__6=${{ secrets.COMMAND_ACCESS_DISABLED_COMMAND_6 || '' }}
        ENVEOF
        sudo -n chown ${{ env.RUNTIME_USER }}:${{ env.RUNTIME_USER }} ${{ env.DEPLOY_PATH }}/.env
        sudo -n chmod 600 ${{ env.DEPLOY_PATH }}/.env"

    - name: Set permissions
      run: |
        ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ env.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
          "sudo -n chown -R ${{ env.RUNTIME_USER }}:${{ env.RUNTIME_USER }} ${{ env.DEPLOY_PATH }} && \
           sudo -n chmod +x ${{ env.DEPLOY_PATH }}/PandaBot"

    - name: Start bot service
      run: |
        ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ env.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
          "sudo -n systemctl start pandabot.service"

    - name: Check service status
      run: |
        ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ env.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
          "ok=0; \
           for i in \$(seq 1 20); do \
             ACTIVE=\$(sudo -n systemctl is-active pandabot.service || true); \
             SUB=\$(sudo -n systemctl show -p SubState --value pandabot.service || true); \
             echo \"Attempt \$i: active=\$ACTIVE substate=\$SUB\"; \
             if [ \"\$ACTIVE\" = \"active\" ] && [ \"\$SUB\" = \"running\" ]; then \
               ok=1; \
               break; \
             fi; \
             sleep 3; \
           done; \
           sudo -n systemctl status pandabot.service --no-pager || true; \
           sudo -n systemctl show pandabot.service -p ActiveState,SubState,ExecMainStatus,ExecMainCode,Result --no-pager || true; \
           sudo -n journalctl -u pandabot.service -n 200 --no-pager || true; \
           [ \"\$ok\" -eq 1 ]"

    - name: Cleanup SSH key
      if: always()
      run: rm -f ~/.ssh/deploy_key
